# ============================================================
# openai.yaml —— deepseek-vision 技能的插件清单文件
#
# 这个文件是给 Codex 使用的“技能注册表”：
# 它告诉 Codex，系统里存在一个名为 "DeepSeek Vision" 的扩展能力，
# 以及这个能力如何被展示、如何被调用。
#
# YAML 语法要点：
#   1. 使用“缩进”表示层级关系，子字段必须比父字段多缩进。
#   2. 键和值之间用 ": "（冒号 + 空格）分隔。
#   3. 以 "#" 开头的是注释，只用来解释，不参与实际功能。
# ============================================================

# interface：定义这个能力在 Codex 界面/提示词中如何呈现
interface:
  # 对外显示的名称，用户或 Codex 在任务中看到的叫法
  display_name: "DeepSeek Vision"

  # 一句话简介，说明这个能力能做什么：
  # 通过 MiMo V2.5 处理文本、图片、音频和视频内容
  short_description: "Process text, image, audio and video content with MiMo V2.5."

  # 默认提示词：
  # 当没有显式给出具体指令时，Codex 会用这句话引导调用 deepseek-vision。
  # "$deepseek-vision" 是一个占位符，实际执行时会替换成具体的命令名。
  default_prompt: "Use $deepseek-vision to process this text/image/audio/video content through MiMo V2.5."

# policy：定义这个能力被调用的策略/规则
policy:
  # 是否允许“隐式调用”：
  # true 表示即使使用者没有明确说“请使用 deepseek-vision”，
  # Codex 也可以根据上下文自动判断并调用这个能力，体验更顺滑。
  # 如果改成 false，则必须由使用者显式要求时才会调用。
  allow_implicit_invocation: true
